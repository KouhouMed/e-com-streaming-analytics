version: "3.8"

# ──────────────────────────────────────────────────────────────────────────────
# Day 1 — Core infrastructure: Kafka (KRaft, no Zookeeper) + PostgreSQL
# Day 2 — Clickstream producer (generator.py)
# Day 3 — Spark master + worker + stream-processor (console sink)
# Day 4 — Windowed aggregations with watermark (revenue + action counts)
# Day 5 — foreachBatch PostgreSQL sink (hourly_revenue, category_metrics)
# Day 6 — Streamlit live dashboard (revenue line chart + category bar chart)
# All ports and credentials are read from .env (see .env.example).
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Apache Kafka (single-node KRaft broker + controller) ────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka
    ports:
      # Host access: localhost:9092  (KAFKA_EXTERNAL_PORT)
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      # KRaft identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      CLUSTER_ID: "${CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}"

      # Three listeners:
      #   PLAINTEXT_HOST  → exposed to the Docker host (port 9092)
      #   PLAINTEXT       → used by other containers inside the Docker network (port 29092)
      #   CONTROLLER      → internal KRaft controller traffic (port 29093)
      KAFKA_LISTENERS: "PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9092},PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Single-node tuning (replication factor = 1 is safe for local dev)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ecom_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ecom_pass}"
      POSTGRES_DB: "${POSTGRES_DB:-ecom_db}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql is executed once on first startup
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom_user} -d ${POSTGRES_DB:-ecom_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Spark Master ─────────────────────────────────────────────────────────────
  spark-master:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: spark-master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"   # Spark Web UI
      - "7077:7077"                              # Spark master RPC port
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Spark Worker ──────────────────────────────────────────────────────────────
  spark-worker:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: "spark://spark-master:7077"
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-2G}"
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-2}"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "${SPARK_WORKER_UI_PORT:-8081}:8081"   # Worker Web UI
    restart: unless-stopped

  # ── Stream Processor (spark-submit client) ────────────────────────────────────
  # Submits stream_processor.py to the Spark cluster in client-deploy mode.
  # The script is volume-mounted so edits take effect on the next container restart
  # without a full image rebuild.
  stream-processor:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: stream-processor
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # ── Kafka ──────────────────────────────────────────────────────────────
      KAFKA_BOOTSTRAP_SERVERS: "kafka:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_TOPIC_CLICKSTREAM: "${KAFKA_TOPIC_CLICKSTREAM:-ecom.clickstream}"
      TRIGGER_INTERVAL_SECS:   "${TRIGGER_INTERVAL_SECS:-10}"
      CHECKPOINT_DIR:          "/tmp/spark-checkpoints"
      # Watermark & window durations — lower WATERMARK_DURATION in dev for faster output
      WATERMARK_DURATION:       "${WATERMARK_DURATION:-10 minutes}"
      REVENUE_WINDOW_DURATION:  "${REVENUE_WINDOW_DURATION:-1 minute}"
      ACTIVITY_WINDOW_DURATION: "${ACTIVITY_WINDOW_DURATION:-5 minutes}"
      ACTIVITY_SLIDE_DURATION:  "${ACTIVITY_SLIDE_DURATION:-1 minute}"
      # ── PostgreSQL (foreachBatch sink) ─────────────────────────────────────
      # Use the container name "postgres" — not "localhost" — for inter-container comms
      POSTGRES_HOST:     "postgres"
      POSTGRES_PORT:     "${POSTGRES_PORT:-5432}"
      POSTGRES_DB:       "${POSTGRES_DB:-ecom_db}"
      POSTGRES_USER:     "${POSTGRES_USER:-ecom_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ecom_pass}"
    volumes:
      - ./consumer:/opt/spark/jobs     # mount scripts without rebuild
      - spark_checkpoints:/tmp/spark-checkpoints
    # Override the bitnami entrypoint to run spark-submit directly
    entrypoint: ["/opt/bitnami/spark/bin/spark-submit"]
    command:
      - "--master"
      - "spark://spark-master:7077"
      - "--deploy-mode"
      - "client"
      - "--conf"
      - "spark.driver.host=stream-processor"   # advertise this container's hostname to workers
      - "--conf"
      - "spark.driver.bindAddress=0.0.0.0"
      - "/opt/spark/jobs/stream_processor.py"
    ports:
      - "4040:4040"    # Spark application UI
    restart: on-failure

  # ── Streamlit live dashboard ─────────────────────────────────────────────────
  # Reads from ecom.hourly_revenue and ecom.category_metrics and serves the
  # dashboard at http://localhost:8501 (or DASHBOARD_PORT from .env).
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST:     "postgres"
      POSTGRES_PORT:     "${POSTGRES_PORT:-5432}"
      POSTGRES_DB:       "${POSTGRES_DB:-ecom_db}"
      POSTGRES_USER:     "${POSTGRES_USER:-ecom_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-ecom_pass}"
      DASHBOARD_REFRESH_MS:       "${DASHBOARD_REFRESH_MS:-3000}"
      DASHBOARD_LOOKBACK_MINUTES: "${DASHBOARD_LOOKBACK_MINUTES:-60}"
      DASHBOARD_CATEGORY_WINDOW:  "${DASHBOARD_CATEGORY_WINDOW:-30}"
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    restart: unless-stopped

  # ── Clickstream event producer ───────────────────────────────────────────────
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # Containers reach Kafka on the internal listener (kafka:29092)
      KAFKA_BOOTSTRAP_SERVERS: "kafka:${KAFKA_INTERNAL_PORT:-29092}"
      KAFKA_TOPIC_CLICKSTREAM: "${KAFKA_TOPIC_CLICKSTREAM:-ecom.clickstream}"
      EVENTS_PER_SECOND: "${EVENTS_PER_SECOND:-5}"
      KAFKA_STARTUP_RETRIES: "${KAFKA_STARTUP_RETRIES:-10}"
      KAFKA_STARTUP_RETRY_DELAY: "${KAFKA_STARTUP_RETRY_DELAY:-3}"
    restart: on-failure

# ── Named volumes (data persists across docker compose down/up) ──────────────
volumes:
  kafka_data:
    driver: local
  postgres_data:
    driver: local
  spark_checkpoints:
    driver: local
